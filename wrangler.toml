name = "wc-results"
pages_build_output_dir = "public"
compatibility_date = "2026-06-01"

# D1 database binding.
# 1. Create the DB:   npx wrangler d1 create wc-results
# 2. Copy the returned database_id into the line below.
[[d1_databases]]
binding = "DB"
database_name = "wc-results"
database_id = "a7f348eb-612a-442b-aa85-5c0044dbdd4c"

# Non-secret defaults for local dev. In production set JOIN_CODE and ADMIN_KEY
# as encrypted secrets in the Cloudflare Pages dashboard instead.
[vars]
JOIN_CODE = "WC2026"
ADMIN_KEY = "x0KfmaPl_zgbTIPk"
